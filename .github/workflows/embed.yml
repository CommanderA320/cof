name: Embed Documents

on:
  push:
    paths:
      - 'docs/pdfs/**'
  workflow_dispatch:
    inputs:
      doc_code:
        description: 'Specific doc_code to embed (filename without .pdf, leave empty for all PDFs)'
        required: false
        default: ''

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pymupdf qdrant-client openai

      - name: Delete removed PDFs from Qdrant
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, subprocess
          from qdrant_client import QdrantClient
          from qdrant_client.models import Filter, FieldCondition, MatchValue

          QDRANT_URL = os.environ['QDRANT_URL']
          QDRANT_API_KEY = os.environ['QDRANT_API_KEY']
          COLLECTION = 'documents'

          result = subprocess.run(
            ['git', 'diff', '--name-status', 'HEAD~1', 'HEAD'],
            capture_output=True, text=True
          )

          deleted = []
          for line in result.stdout.splitlines():
            if line.startswith('D') and line.endswith('.pdf') and 'docs/pdfs/' in line:
              filename = os.path.basename(line.split('\t')[1])
              doc_code = os.path.splitext(filename)[0]
              deleted.append(doc_code)

          if not deleted:
            print('No deleted PDFs found')
          else:
            qdrant = QdrantClient(url=QDRANT_URL, api_key=QDRANT_API_KEY)
            for doc_code in deleted:
              try:
                qdrant.delete(
                  collection_name=COLLECTION,
                  points_selector=Filter(
                    must=[FieldCondition(key='doc_code', match=MatchValue(value=doc_code))]
                  )
                )
                print(f'DELETED from Qdrant: {doc_code}')
              except Exception as e:
                print(f'Error deleting {doc_code}: {e}')
          PYEOF

      - name: Extract PDFs and Embed to Qdrant
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SPECIFIC_DOC: ${{ github.event.inputs.doc_code }}
        run: |
          python3 << 'PYEOF'
          import os, sys, re, fitz, uuid, hashlib
          from openai import OpenAI
          from qdrant_client import QdrantClient
          from qdrant_client.models import Distance, VectorParams, PointStruct, Filter, FieldCondition, MatchValue, PayloadSchemaType

          QDRANT_URL = os.environ['QDRANT_URL']
          QDRANT_API_KEY = os.environ['QDRANT_API_KEY']
          OPENAI_KEY = os.environ['OPENAI_API_KEY']
          SPECIFIC_DOC = os.environ.get('SPECIFIC_DOC', '').strip()
          PDF_DIR = 'docs/pdfs'
          COLLECTION = 'documents'

          openai_client = OpenAI(api_key=OPENAI_KEY)
          qdrant = QdrantClient(url=QDRANT_URL, api_key=QDRANT_API_KEY)

          try:
            qdrant.get_collection(COLLECTION)
            print(f'Collection {COLLECTION} exists')
          except Exception:
            qdrant.create_collection(
              collection_name=COLLECTION,
              vectors_config=VectorParams(size=1536, distance=Distance.COSINE)
            )
            print(f'Created collection {COLLECTION}')
            qdrant.create_payload_index(
              collection_name=COLLECTION,
              field_name='doc_code',
              field_schema=PayloadSchemaType.KEYWORD
            )
            print('Created doc_code index')

          try:
            qdrant.create_payload_index(
              collection_name=COLLECTION,
              field_name='doc_code',
              field_schema=PayloadSchemaType.KEYWORD
            )
          except Exception as e:
            print(f'Index note: {e}')

          def get_pdfs():
            if not os.path.exists(PDF_DIR):
              print('No docs/pdfs folder')
              return []
            files = [f for f in os.listdir(PDF_DIR) if f.lower().endswith('.pdf')]
            if SPECIFIC_DOC:
              files = [f for f in files if os.path.splitext(f)[0].upper() == SPECIFIC_DOC.upper()]
            return files

          def extract_text(pdf_path):
            try:
              doc = fitz.open(pdf_path)
              text = ''
              for page in doc:
                text += page.get_text()
              doc.close()
              return text.replace('\x00', '')
            except Exception as e:
              print(f'WARNING: Could not extract {pdf_path}: {e}')
              return ''

          def chunk_text(text, doc_code):
            if doc_code.upper() == 'QRH':
              HEADER = re.compile(r'^([A-Z][A-Z0-9 /\-]{3,59})\s*$', re.MULTILINE)
              matches = list(HEADER.finditer(text))
              chunks = []
              for idx, m in enumerate(matches):
                start = m.start()
                end = matches[idx+1].start() if idx+1 < len(matches) else len(text)
                content = text[start:end].strip()
                if len(content) > 80:
                  chunks.append({'doc_code': doc_code, 'chunk_index': idx, 'content': content})
              if chunks:
                print(f'QRH procedure-based chunking: {len(chunks)} chunks')
                return chunks
              print('QRH header detection failed, falling back to sliding window')

            chunk_size = 2000 if 'EASA' in doc_code else 1500
            overlap = 200
            chunks = []
            start = 0
            index = 0
            while start < len(text):
              end = min(start + chunk_size, len(text))
              content = text[start:end].strip()
              if len(content) > 50:
                chunks.append({'doc_code': doc_code, 'chunk_index': index, 'content': content})
                index += 1
              start += chunk_size - overlap
            return chunks

          def embed_texts(texts):
            response = openai_client.embeddings.create(
              model='text-embedding-3-small',
              input=texts
            )
            return [d.embedding for d in response.data]

          def delete_existing(doc_code):
            try:
              qdrant.delete(
                collection_name=COLLECTION,
                points_selector=Filter(
                  must=[FieldCondition(key='doc_code', match=MatchValue(value=doc_code))]
                )
              )
            except Exception as e:
              print(f'Delete note: {e}')

          def chunk_id(doc_code, chunk_index):
            h = hashlib.md5(f'{doc_code}_{chunk_index}'.encode()).hexdigest()
            return str(uuid.UUID(h))

          pdfs = get_pdfs()
          if not pdfs:
            print('No PDFs to process')
            sys.exit(0)

          for pdf_file in pdfs:
            doc_code = os.path.splitext(pdf_file)[0]
            pdf_path = os.path.join(PDF_DIR, pdf_file)

            print(f'Processing: {pdf_file}')
            text = extract_text(pdf_path)
            print(f'Extracted: {len(text)} chars')

            if not text:
              print(f'SKIP: {doc_code} (no text extracted)')
              continue
            chunks = chunk_text(text, doc_code)
            print(f'Chunks: {len(chunks)}')

            delete_existing(doc_code)
            print(f'Deleted existing: {doc_code}')

            for i in range(0, len(chunks), 50):
              batch = chunks[i:i+50]
              embeddings = embed_texts([c['content'] for c in batch])
              points = [
                PointStruct(
                  id=chunk_id(c['doc_code'], c['chunk_index']),
                  vector=embeddings[j],
                  payload={'doc_code': c['doc_code'], 'chunk_index': c['chunk_index'], 'content': c['content']}
                )
                for j, c in enumerate(batch)
              ]
              qdrant.upsert(collection_name=COLLECTION, points=points)
              print(f'Progress: {doc_code} {min(i+50, len(chunks))}/{len(chunks)}')

            print(f'DONE: {doc_code} {len(chunks)} chunks')

          print('ALL DONE')
          PYEOF

      - name: Extract Fleet DB from FCOM
        env:
          SPECIFIC_DOC: ${{ github.event.inputs.doc_code }}
        run: |
          python3 << 'PYEOF'
          import os, re, json, sys, fitz

          SPECIFIC_DOC = os.environ.get('SPECIFIC_DOC', '').strip().upper()
          PDF_DIR = 'docs/pdfs'
          FLEET_JSON = 'docs/fleet.json'

          # Sadece FCOM islendiyse veya tum PDF'ler islendiyse calistir
          fcom_processed = (not SPECIFIC_DOC) or (SPECIFIC_DOC == 'FCOM')
          if not fcom_processed:
            print(f'Skipping fleet extraction (not FCOM run)')
            sys.exit(0)

          # FCOM.pdf bul
          fcom_path = None
          for f in os.listdir(PDF_DIR):
            if f.upper() == 'FCOM.PDF':
              fcom_path = os.path.join(PDF_DIR, f)
              break

          if not fcom_path:
            print('FCOM.pdf not found')
            sys.exit(0)

          print(f'Extracting fleet from: {fcom_path}')

          doc = fitz.open(fcom_path)
          text = ''
          for page in doc:
            text += page.get_text()
          doc.close()

          # Allocation table bolumunu bul
          table_idx = -1
          for pattern in [r'AIRCRAFT\s*ALLOCATION\s*TABLE', r'ALLOCATION\s*TABLE', r'A/C\s*ALLOCATION']:
            m = re.search(pattern, text, re.IGNORECASE)
            if m:
              table_idx = m.start()
              break

          if table_idx == -1:
            print('Allocation table not found in FCOM')
            sys.exit(0)

          table_section = text[table_idx:table_idx + 50000]
          lines = table_section.split('\n')
          print('DEBUG first 30 lines:')
          for dl in lines[:30]: print(repr(dl))

          fleet = {}
          count = 0

          # MSN-first approach: MSN bul, yakin satirlarda tescil ve model ara
          for i, line in enumerate(lines):
            # MSN: satirin basinda 4-6 haneli sayi (yil degil)
            msn_match = re.search(r'^\s*(\d{4,6})\s', line)
            if not msn_match:
              continue
            n = int(msn_match.group(1))
            if n >= 1900 and n <= 2099:
              continue
            msn = msn_match.group(1)

            search_range = ' '.join(lines[max(0, i-2):min(len(lines), i+3)])

            # Tescil: TC-XXX formati
            reg_match = re.search(r'\b(TC-[A-Z]{3})\b', search_range)
            if not reg_match:
              continue
            reg = reg_match.group(1)

            # Model: 3XX-XXX formati
            model = ''
            model_m = re.search(r'\b(3(?:18|19|20|21)-\d{3}[A-Z]{0,2})\b', search_range)
            if model_m:
              model = model_m.group(1)

            # Tip belirle
            ac_type = ''
            last = model.upper().split('-')[-1] if model else ''
            if '321' in model:
              ac_type = 'A321neo' if 'N' in last else 'A321ceo'
            elif '320' in model:
              ac_type = 'A320neo' if 'N' in last else 'A320ceo'
            elif '319' in model:
              ac_type = 'A319'

            if reg and msn:
              fleet[reg] = {'msn': msn, 'model': model, 'type': ac_type}
              count += 1

          if count == 0:
            print('No aircraft parsed from allocation table')
            sys.exit(0)

          # Mevcut fleet.json ile birlestir
          existing = {}
          if os.path.exists(FLEET_JSON):
            try:
              with open(FLEET_JSON) as f:
                existing = json.load(f)
            except:
              pass

          existing.update(fleet)

          with open(FLEET_JSON, 'w') as f:
            json.dump(existing, f, indent=2, sort_keys=True)

          print(f'fleet.json: {count} aircraft parsed, {len(existing)} total')
          PYEOF

      - name: Commit fleet.json if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f docs/fleet.json ]; then
            git add docs/fleet.json
            if git diff --staged --quiet; then
              echo "No changes to fleet.json"
            else
              git commit -m "Auto-update fleet.json from FCOM allocation table"
              git push
            fi
          else
            echo "fleet.json not generated, skipping"
          fi
