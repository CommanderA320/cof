name: Embed Documents

on:
  # push tetikleyicisi 2026-09-19'da, CI yeniden yazımı (detect_changes'in
  # tüm senaryoları kapsayan doc_codes_to_process çözümlemesi, embed_doc.py
  # çoklu doc_code desteği, güncel scriptleri çağıran dispatcher, gated
  # image captioning) tamamlanıp test edildikten sonra yeniden eklendi.
  # Path filtresi kasıtlı olarak dar (sadece *.pdf/*.PDF): workflow'un
  # kendi "Commit checkpoint files" adımı docs/pdfs/.page_hashes_v1.json ve
  # .monthly_image_caption_spend.json'u aynı klasöre push ediyor — daha
  # geniş bir filtre (örn. docs/pdfs/**) bu commit'lerin workflow'u
  # kendi kendine yeniden tetiklemesine (sonsuz döngü) yol açardı.
  workflow_dispatch:
    inputs:
      doc_code:
        description: 'Specific doc_code to embed (filename without .pdf, leave empty for all PDFs)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'docs/pdfs/*.pdf'
      - 'docs/pdfs/*.PDF'

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # test-changed-files.yml'de izole şekilde doğrulanmış tespit mantığı
      # (bkz. run'lar: 35380703146, 35380838750), artık üç tetikleme
      # senaryosunun hepsini kapsayan birleşik bir 'doc_codes_to_process'
      # output'una çözümleniyor. Bu adım hâlâ hiçbir sonraki adım tarafından
      # kullanılmıyor (b/c/d ayrı adımlarda gelecek).
      - name: Detect changed docs/pdfs files
        id: detect_changes
        run: |
          echo "github.event_name   = ${{ github.event_name }}"
          echo "github.event.before = ${{ github.event.before }}"
          echo "github.sha          = ${{ github.sha }}"

          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          DOC_CODES=""

          if [ "$BEFORE" = "$ZERO" ] || [ -z "$BEFORE" ]; then
            echo "İlk push ya da 'before' SHA'sı yok — HEAD~1 ile karşılaştırılıyor (fallback)."
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              COMPARE_FROM="HEAD~1"
            else
              echo "Karşılaştırılacak önceki commit yok. Değişen dosya yok kabul ediliyor."
              COMPARE_FROM=""
            fi
          else
            COMPARE_FROM="$BEFORE"
          fi

          if [ -n "$COMPARE_FROM" ]; then
            echo "Karşılaştırma: $COMPARE_FROM -> ${{ github.sha }}"

            CHANGED_FILES=$(git diff --name-only --diff-filter=AM "$COMPARE_FROM" "${{ github.sha }}" -- 'docs/pdfs/*.pdf' 'docs/pdfs/*.PDF')
            DELETED_FILES=$(git diff --name-only --diff-filter=D "$COMPARE_FROM" "${{ github.sha }}" -- 'docs/pdfs/*.pdf' 'docs/pdfs/*.PDF')

            echo "=== Değişen (added/modified) PDF'ler ==="
            echo "${CHANGED_FILES:-(hiçbiri)}"
            echo "=== Silinen PDF'ler ==="
            echo "${DELETED_FILES:-(hiçbiri)}"

            # Dosya adlarını doc_code'a çevir (docs/pdfs/ öneki + .pdf uzantısı atılır)
            DOC_CODES=$(echo "$CHANGED_FILES" | sed -E 's#^docs/pdfs/##; s#\.[Pp][Dd][Ff]$##' | grep -v '^$' || true)
          fi

          echo "=== git diff'e göre değişen doc_code'lar (bilgi amaçlı, tüm tetikleyicilerde hesaplanır) ==="
          echo "${DOC_CODES:-(hiçbiri)}"

          if [ -z "$DOC_CODES" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          echo "changed_doc_codes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DOC_CODES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          # ---------------------------------------------------------------
          # Birleşik çözümleme: hangi doc_code'lar işlenecek?
          #   1) workflow_dispatch + doc_code DOLU  -> sadece o doc_code
          #   2) workflow_dispatch + doc_code BOŞ   -> docs/pdfs/ altındaki HEPSİ
          #   3) push (ileride açılınca)            -> yukarıda git diff ile
          #                                            bulunan DOC_CODES (boş olabilir)
          #   4) tanınmayan bir event_name           -> güvenlik için BOŞ (hiçbir şey işlenmez)
          # ---------------------------------------------------------------
          EVENT_NAME="${{ github.event_name }}"
          INPUT_DOC_CODE="${{ github.event.inputs.doc_code }}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_DOC_CODE" ]; then
            echo "Senaryo: manuel tetikleme, tek doc_code belirtilmiş: $INPUT_DOC_CODE"
            DOC_CODES_TO_PROCESS="$INPUT_DOC_CODE"

          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$INPUT_DOC_CODE" ]; then
            echo "Senaryo: manuel tetikleme, doc_code boş — docs/pdfs/ altındaki TÜM dokümanlar işlenecek"
            DOC_CODES_TO_PROCESS=$(find docs/pdfs -maxdepth 1 \( -iname '*.pdf' \) -type f \
              | sed -E 's#^docs/pdfs/##; s#\.[Pp][Dd][Ff]$##' | sort)

          elif [ "$EVENT_NAME" = "push" ]; then
            echo "Senaryo: push tetiklemesi — sadece değişen doc_code'lar işlenecek"
            DOC_CODES_TO_PROCESS="$DOC_CODES"

          else
            echo "Senaryo: tanınmayan event_name ($EVENT_NAME) — güvenlik için hiçbir şey işlenmeyecek"
            DOC_CODES_TO_PROCESS=""
          fi

          echo "=== NİHAİ işlenecek doc_code listesi (doc_codes_to_process) ==="
          echo "${DOC_CODES_TO_PROCESS:-(hiçbiri — işlenecek doküman yok)}"

          echo "doc_codes_to_process<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DOC_CODES_TO_PROCESS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pymupdf qdrant-client openai python-dotenv anthropic

      - name: Delete removed PDFs from Qdrant
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, subprocess
          from qdrant_client import QdrantClient
          from qdrant_client.models import Filter, FieldCondition, MatchValue

          QDRANT_URL = os.environ['QDRANT_URL']
          QDRANT_API_KEY = os.environ['QDRANT_API_KEY']
          COLLECTION = 'documents'

          result = subprocess.run(
            ['git', 'diff', '--name-status', 'HEAD~1', 'HEAD'],
            capture_output=True, text=True
          )

          deleted = []
          for line in result.stdout.splitlines():
            if line.startswith('D') and line.endswith('.pdf') and 'docs/pdfs/' in line:
              filename = os.path.basename(line.split('\t')[1])
              doc_code = os.path.splitext(filename)[0]
              deleted.append(doc_code)

          if not deleted:
            print('No deleted PDFs found')
          else:
            qdrant = QdrantClient(url=QDRANT_URL, api_key=QDRANT_API_KEY)
            for doc_code in deleted:
              try:
                qdrant.delete(
                  collection_name=COLLECTION,
                  points_selector=Filter(
                    must=[FieldCondition(key='doc_code', match=MatchValue(value=doc_code))]
                  )
                )
                print(f'DELETED from Qdrant: {doc_code}')
              except Exception as e:
                print(f'Error deleting {doc_code}: {e}')
          PYEOF

      - name: Extract PDFs and Embed to Qdrant
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          DOC_CODES="${{ steps.detect_changes.outputs.doc_codes_to_process }}"

          if [ -z "$DOC_CODES" ]; then
            echo "İşlenecek doc_code yok, çıkılıyor."
            exit 0
          fi

          for doc_code in $DOC_CODES; do
            echo "=== İşleniyor: $doc_code ==="
            case "$doc_code" in
              QRH)
                python3 scripts/embed_qrh_ident.py
                ;;
              MEL)
                python3 scripts/embed_mel_ident.py
                ;;
              *)
                python3 scripts/embed_doc.py "$doc_code"
                ;;
            esac

            # FCOM/FCTM metni işlendiyse, görselleri de hash-farkı + maliyet
            # kapılarıyla (sayfa tavanı, aylık bütçe) güncelle
            if [ "$doc_code" = "FCOM" ] || [ "$doc_code" = "FCTM" ]; then
              python3 scripts/caption_images_gated.py "$doc_code"
            fi
          done

      # caption_images_gated.py çalıştıysa .page_hashes_v1.json ve/veya
      # .monthly_image_caption_spend.json'u günceller — bunlar CI
      # runner'ının geçici dosya sisteminde; commit edilmezse run bitince
      # kaybolur ve bir sonraki otomatik tetikleme yine "soğuk başlangıç"
      # olur (hiçbir sayfa "zaten işlendi" görünmez).
      - name: Commit checkpoint files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          [ -f docs/pdfs/.page_hashes_v1.json ] && git add docs/pdfs/.page_hashes_v1.json
          [ -f docs/pdfs/.monthly_image_caption_spend.json ] && git add docs/pdfs/.monthly_image_caption_spend.json

          if git diff --staged --quiet; then
            echo "Checkpoint'te değişiklik yok (ya da dosyalar henüz hiç oluşmadı), commit edilmiyor"
          else
            git commit -m "Update image captioning checkpoints (automatic run)"
            git push
          fi

      - name: Extract Fleet DB from FCOM
        env:
          SPECIFIC_DOC: ${{ github.event.inputs.doc_code }}
        run: |
          python3 << 'PYEOF'
          import os, re, json, sys, fitz

          SPECIFIC_DOC = os.environ.get('SPECIFIC_DOC', '').strip().upper()
          PDF_DIR = 'docs/pdfs'
          FLEET_JSON = 'docs/fleet.json'

          fcom_processed = (not SPECIFIC_DOC) or (SPECIFIC_DOC == 'FCOM')
          if not fcom_processed:
            print(f'Skipping fleet extraction (not FCOM run)')
            sys.exit(0)

          fcom_path = None
          for f in os.listdir(PDF_DIR):
            if f.upper() == 'FCOM.PDF':
              fcom_path = os.path.join(PDF_DIR, f)
              break

          if not fcom_path:
            print('FCOM.pdf not found')
            sys.exit(0)

          print(f'Extracting fleet from: {fcom_path}')

          doc = fitz.open(fcom_path)
          text = ''
          for page in doc:
            text += page.get_text()
          doc.close()

          table_idx = -1
          for pattern in [r'AIRCRAFT\s*ALLOCATION\s*TABLE', r'ALLOCATION\s*TABLE']:
            for m in re.finditer(pattern, text, re.IGNORECASE):
              section = text[m.start():m.start()+5000]
              if re.search(r'\bMSN\b', section) and re.search(r'TC-[A-Z]{3}', section):
                table_idx = m.start()
                break
            if table_idx != -1:
              break

          if table_idx == -1:
            print('Allocation table not found in FCOM')
            sys.exit(0)

          table_section = text[table_idx:table_idx + 50000]
          lines = table_section.split('\n')

          fleet = {}
          count = 0

          i = 0
          while i < len(lines):
            line = lines[i].strip()
            if re.match(r'^\d{4,6}$', line):
              n = int(line)
              if n < 1900 or n > 2099:
                msn = line
                reg = ''
                model = ''
                for j in range(i+1, min(i+6, len(lines))):
                  l = lines[j].strip()
                  if not reg and re.match(r'^TC-[A-Z]{3}$', l):
                    reg = l
                  if not model and re.match(r'^3(?:18|19|20|21)-\d{3}[A-Z]{0,2}$', l):
                    model = l
                  if reg and model:
                    break
                if reg and msn:
                  ac_type = ''
                  last = model.upper().split('-')[-1] if model else ''
                  if '321' in model:
                    ac_type = 'A321neo' if 'N' in last else 'A321ceo'
                  elif '320' in model:
                    ac_type = 'A320neo' if 'N' in last else 'A320ceo'
                  elif '319' in model:
                    ac_type = 'A319'
                  fleet[reg] = {'msn': msn, 'model': model, 'type': ac_type}
                  count += 1
            i += 1

          if count == 0:
            print('No aircraft parsed from allocation table')
            sys.exit(0)

          existing = {}
          if os.path.exists(FLEET_JSON):
            try:
              with open(FLEET_JSON) as f:
                existing = json.load(f)
            except:
              pass

          existing.update(fleet)

          with open(FLEET_JSON, 'w') as f:
            json.dump(existing, f, indent=2, sort_keys=True)

          print(f'fleet.json: {count} aircraft parsed, {len(existing)} total')
          PYEOF

      - name: Commit fleet.json if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f docs/fleet.json ]; then
            git add docs/fleet.json
            if git diff --staged --quiet; then
              echo "No changes to fleet.json"
            else
              git commit -m "Auto-update fleet.json from FCOM allocation table"
              git push
            fi
          else
            echo "fleet.json not generated, skipping"
          fi
