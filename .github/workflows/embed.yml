name: Embed Documents

on:
  push:
    paths:
      - 'docs/**'
  workflow_dispatch:
    inputs:
      doc_code:
        description: 'Specific doc to embed (leave empty for all)'
        required: false
        default: ''

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Embed documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');

          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_SERVICE_KEY;
          const OPENAI_KEY = process.env.OPENAI_API_KEY;

          function chunkText(text, docCode) {
            const CHUNK_SIZE = docCode.includes('EASA') ? 2000 : 800;
            const CHUNK_OVERLAP = docCode.includes('EASA') ? 200 : 100;
            const chunks = [];
            let start = 0, index = 0;
            while (start < text.length) {
              const end = Math.min(start + CHUNK_SIZE, text.length);
              const content = text.slice(start, end).trim();
              if (content.length > 50) chunks.push({ doc_code: docCode, chunk_index: index++, content });
              start += CHUNK_SIZE - CHUNK_OVERLAP;
            }
            return chunks;
          }

          async function embedTexts(texts) {
            const res = await fetch('https://api.openai.com/v1/embeddings', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + OPENAI_KEY },
              body: JSON.stringify({ model: 'text-embedding-3-small', input: texts }),
            });
            const data = await res.json();
            if (!data.data) throw new Error('OpenAI error: ' + JSON.stringify(data));
            return data.data.map(d => d.embedding);
          }

          async function deleteExisting(docCode) {
            await fetch(SUPABASE_URL + '/rest/v1/documents?doc_code=eq.' + encodeURIComponent(docCode), {
              method: 'DELETE',
              headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY },
            });
          }

          async function insertChunks(chunks, embeddings) {
            const rows = chunks.map((c, i) => ({ doc_code: c.doc_code, chunk_index: c.chunk_index, content: c.content, embedding: embeddings[i] }));
            const res = await fetch(SUPABASE_URL + '/rest/v1/documents', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Prefer': 'return=minimal' },
              body: JSON.stringify(rows),
            });
            if (!res.ok) throw new Error('Supabase insert failed: ' + await res.text());
          }

          async function embedDoc(docCode) {
            const filePath = path.join('docs', docCode.replace(/[^a-zA-Z0-9_\-]/g, '_') + '.txt');
            if (!fs.existsSync(filePath)) {
              console.log('SKIP — file not found:', filePath);
              return;
            }
            let text = fs.readFileSync(filePath, 'utf8');
            // Remove null bytes and other problematic characters
            text = text.replace(/\u0000/g, '').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
            if (!text || text.length < 100) { console.log('SKIP — too short:', docCode); return; }
            
            console.log('Embedding:', docCode, '(' + text.length + ' chars)');
            const chunks = chunkText(text, docCode);
            console.log('Chunks:', chunks.length);
            
            await deleteExisting(docCode);
            
            for (let i = 0; i < chunks.length; i += 50) {
              const batch = chunks.slice(i, i + 50);
              const embeddings = await embedTexts(batch.map(c => c.content));
              await insertChunks(batch, embeddings);
              console.log('Progress:', docCode, Math.min(i + 50, chunks.length) + '/' + chunks.length);
            }
            console.log('DONE:', docCode, chunks.length, 'chunks');
          }

          async function main() {
            const specificDoc = '${{ github.event.inputs.doc_code }}';
            
            if (specificDoc && specificDoc.trim()) {
              await embedDoc(specificDoc.trim());
            } else {
              // Embed all docs in docs/ folder
              const files = fs.readdirSync('docs').filter(f => f.endsWith('.txt'));
              for (const file of files) {
                const docCode = file.replace('.txt', '').replace(/_/g, ' ').trim();
                // Try both underscore and space versions
                const docCodeRaw = file.replace('.txt', '');
                await embedDoc(docCodeRaw);
              }
            }
            console.log('ALL DONE');
          }

          main().catch(e => { console.error(e); process.exit(1); });
          "
